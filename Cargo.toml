[package]
name = "ib-charts"
version = "0.2.0"
edition = "2024"
description = "Read-only, TradingView-style charts powered by your own IB Gateway / TWS market data"
license = "MIT"
readme = "README.md"
keywords = ["interactive-brokers", "trading", "charts", "market-data", "ibkr"]
categories = ["finance", "visualization"]

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.10", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.34"
ibapi = "5.8.0"
keyring = "4.2.0"
notify = "9.0.0"
opener = "0.9.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

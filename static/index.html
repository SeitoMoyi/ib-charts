<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IB Charts</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="toolbar">
    <button id="gw-pill" type="button"><span class="gw-dot"></span><span class="gw-label">Gateway</span></button>
    <div id="symbol-box">
      <input id="symbol" type="text" spellcheck="false" autocomplete="off" placeholder="Symbol" title="AAPL · EUR.USD · /ES · ^SPX · $BTC · 7203:TSEJ:JPY">
      <ul id="suggestions" hidden></ul>
    </div>
    <button id="wl-star" type="button" title="Add to watchlist">☆</button>
    <button id="alert-btn" type="button" title="Create alert (Alt+A)">⏰</button>
    <div class="group" id="timeframes"></div>
    <div class="group">
      <button id="type-btn" title="Chart type">Candles ▾</button>
      <button id="compare-btn" title="Compare with another symbol">＋ Compare</button>
    </div>
    <div class="group">
      <button id="ind-btn" title="Add an indicator">ƒx Indicators</button>
      <button id="script-btn" title="Write your own indicator">&lt;/&gt; Script editor</button>
    </div>
    <div class="group">
      <button id="rth" title="Regular trading hours only">RTH</button>
      <button id="replay-btn" title="Bar replay">⏪ Replay</button>
      <button id="shot-btn" title="Chart image (Alt+S copies)">📷</button>
      <button id="layout-btn" title="Chart layout, linking and saved layouts">▦</button>
      <button id="settings-btn" title="Settings: theme, time zone, chart overlays">⚙</button>
      <button id="help-btn" title="Keyboard shortcuts (?)">?</button>
    </div>
    <div id="status"><span id="dot"></span><span id="status-text">Connecting…</span></div>
    <button id="wl-toggle" type="button" title="Show / hide the side panel">☰ Panel</button>
    <a id="attribution" href="https://www.tradingview.com/" target="_blank" rel="noopener"
       title="Charts by TradingView Lightweight Charts™ — Copyright (c) TradingView, Inc.">Charts by TradingView</a>
  </header>
  <div id="workspace">
    <nav id="draw-tools"></nav>
    <div id="objects" hidden></div>
    <div id="center">
      <main id="charts"></main>
      <section id="editor" hidden></section>
    </div>
    <aside id="sidebar">
      <div class="sb-tabs">
        <button data-tab="watchlist" class="active">Watchlist</button>
        <button data-tab="alerts">Alerts <span id="alert-count"></span></button>
        <button data-tab="datawin">Data</button>
        <button data-tab="positions">Positions</button>
        <button data-tab="scanner">Scanner</button>
        <button data-tab="news">News</button>
        <button data-tab="info">Info</button>
      </div>
      <div id="watchlist" class="sb-pane"></div>
      <div id="alerts" class="sb-pane" hidden></div>
      <div id="datawin" class="sb-pane" hidden></div>
      <div id="positions" class="sb-pane scroll" hidden></div>
      <div id="scanner" class="sb-pane scroll" hidden></div>
      <div id="news" class="sb-pane scroll" hidden></div>
      <div id="info" class="sb-pane scroll" hidden></div>
    </aside>
  </div>
  <dialog id="gw-dialog"></dialog>
  <dialog id="ind-dialog"></dialog>
  <dialog id="study-dialog"></dialog>
  <dialog id="alert-dialog"></dialog>
  <dialog id="help-dialog"></dialog>
  <dialog id="news-dialog" class="wide"></dialog>
  <script src="/vendor/codemirror/codemirror.js"></script>
  <script src="/vendor/codemirror/javascript.js"></script>
  <script src="/vendor/codemirror/matchbrackets.js"></script>
  <script src="/vendor/codemirror/closebrackets.js"></script>
  <script src="/vendor/codemirror/comment.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
